version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: apex_trading_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: apex_admin
      POSTGRES_PASSWORD: apex_secure_password_change_in_prod
      POSTGRES_DB: apex_trading
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apex_admin -d apex_trading"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: apex_trading_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    container_name: apex_trading_backend
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://apex_admin:apex_secure_password_change_in_prod@postgres:5432/apex_trading
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: apex-crypto-ultra-secure-key-32b!
      BINANCE_API_KEY: ""
      BINANCE_API_SECRET: ""
      COINGLASS_API_KEY: ""
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    container_name: apex_trading_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
