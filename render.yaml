services:
  # ====================================================================
  # ApexCrypto Pro: All-in-One Autonomous Trading Platform on Render
  # Runs backend API, WebSockets (/ws), and serves the React UI frontend
  # ====================================================================
  - type: web
    name: apexcrypto-trading-platform
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      # Database: Uses embedded PGlite WASM (zero-config, data stored in /data/pglite on Render disk)
      - key: PERSIST_DB
        value: "false"
      # Point PGlite data dir to the Render persistent disk mount (if disk is added in dashboard)
      # - key: DATABASE_DIR
      #   value: /data/pglite
      # Optional: External/Managed Postgres Database URL (recommended for production stability)
      # If provided, platform automatically switches from WASM PGlite to full PostgreSQL.
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: apexcrypto-db
      #     property: connectionString
      # Optional Binance Trading Credentials (for live/testnet orders):
      # - key: BINANCE_API_KEY
      #   sync: false
      # - key: BINANCE_API_SECRET
      #   sync: false
      # - key: BINANCE_TESTNET
      #   value: "false"
      # Optional Telegram Alerts:
      # - key: TELEGRAM_BOT_TOKEN
      #   sync: false
      # - key: TELEGRAM_CHAT_ID
      #   sync: false
      # Optional CoinGlass for liquidity heatmap:
      # - key: COINGLASS_API_KEY
      #   sync: false
